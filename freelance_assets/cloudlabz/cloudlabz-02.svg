<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="logoGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EC4E8"/>
      <stop offset="55%" stop-color="#5B8DF0"/>
      <stop offset="100%" stop-color="#9B59F5"/>
    </linearGradient>
    <radialGradient id="eclipseRim" cx="0.66" cy="0.30" r="0.55">
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="86%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hotSpot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="circleFill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="80%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="#161616"/>

  <!-- Outer soft halo -->
  <circle cx="450" cy="540" r="380" fill="url(#outerGlow)"/>

  <!-- Eclipse rim (white glowing edge) -->
  <circle cx="450" cy="540" r="320" fill="url(#eclipseRim)" opacity="0.95"/>

  <!-- The inner circle (dark) -->
  <circle cx="450" cy="540" r="300" fill="url(#circleFill)"/>

  <!-- Bright hot spot on the top-right rim -->
  <circle cx="630" cy="385" r="38" fill="url(#hotSpot)" opacity="0.95"/>

  <!-- COMING SOON text -->
  <text x="450" y="555"
        text-anchor="middle"
        font-family="'Inter','Helvetica Neue',sans-serif"
        font-size="36"
        font-weight="600"
        letter-spacing="3"
        fill="#FFFFFF">COMING SOON ...</text>

  <!-- Progress bar -->
  <rect x="335" y="600" width="230" height="18" rx="9" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1"/>
  <rect x="338" y="603" width="105" height="12" rx="6" fill="#FFFFFF"/>

  <!-- Cloudzlab logo at bottom -->
  <text x="450" y="1080"
        text-anchor="middle"
        font-family="'Inter','Helvetica Neue',sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="-1"
        fill="url(#logoGrad2)">Cloudzlab</text>
</svg>
